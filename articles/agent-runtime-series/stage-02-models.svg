<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">第二阶段：接入模型，同时保持执行可控</title><desc id="desc">第 06 至 10 篇｜真实模型、流式响应、工具批次、输入选择与运行轨迹。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1200" height="820" fill="#f5f8f4"/><g font-family="system-ui,sans-serif" fill="#173b2d"><text x="40" y="48" font-size="28" font-weight="700">第二阶段：接入模型，同时保持执行可控</text><text x="40" y="85" font-size="18">第 06 至 10 篇｜真实模型、流式响应、工具批次、输入选择与运行轨迹。</text><rect x="40" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="184" font-size="23" font-weight="650">选择模型输入</text><text x="58" y="222" font-size="18">完整 State 继续保留</text><text x="58" y="251" font-size="18">成组选择历史与摘要</text><text x="58" y="280" font-size="18">本轮 Context 有大小限制</text><rect x="450" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="184" font-size="23" font-weight="650">模型协议适配</text><text x="468" y="222" font-size="18">转换消息与工具说明</text><text x="468" y="251" font-size="18">把 HTTP 响应转为动作</text><text x="468" y="280" font-size="18">核心循环不依赖服务格式</text><rect x="860" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="184" font-size="23" font-weight="650">模型服务返回响应</text><text x="878" y="222" font-size="18">DeepSeek 或离线替身</text><text x="878" y="251" font-size="18">非流式整体返回</text><text x="878" y="280" font-size="18">流式逐段返回内容</text><rect x="860" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="464" font-size="23" font-weight="650">确认完整 Action</text><text x="878" y="502" font-size="18">增量内容可以展示</text><text x="878" y="531" font-size="18">参数与结束条件未完整</text><text x="878" y="560" font-size="18">就不交给工具执行</text><rect x="450" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="464" font-size="23" font-weight="650">原循环处理动作</text><text x="468" y="502" font-size="18">记录工具请求或 finish</text><text x="468" y="531" font-size="18">工具请求交给批次入口</text><text x="468" y="560" font-size="18">完成请求仍须核对证据</text><rect x="40" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="464" font-size="23" font-weight="650">执行与结果反馈</text><text x="58" y="502" font-size="18">顺序或有界并行调度</text><text x="58" y="531" font-size="18">结果关联原调用身份</text><text x="58" y="560" font-size="18">循环按请求顺序写回</text><path d="M340 235 L450 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="223.0" text-anchor="middle" font-size="17">转换</text><path d="M750 235 L860 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="223.0" text-anchor="middle" font-size="17">请求</text><path d="M1010 315 L1010 430" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1022" y="372.5" text-anchor="start" font-size="17">接收／拼接</text><path d="M860 510 L750 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="498.0" text-anchor="middle" font-size="17">完整动作</text><path d="M450 510 L340 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="498.0" text-anchor="middle" font-size="17">调度</text><path d="M190 430 L190 315" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="202" y="372.5" text-anchor="start" font-size="17">新的事实</text><rect x="40" y="680" width="1120" height="100" rx="12" fill="#e7f1e9"/><text x="60" y="718" font-size="18">过程观察：Agent 实例与有序事件，帮助定位模型、批次、写回和退出阶段。</text><text x="60" y="749" font-size="18">事件负责通知；真正更新状态的仍是循环，观察者不能代替执行门禁。</text></g></svg>