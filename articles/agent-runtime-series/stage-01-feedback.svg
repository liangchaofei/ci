<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">第一阶段：工具结果怎样推动下一次决策</title><desc id="desc">第 01 至 04 篇｜先跑通一条反馈循环，再加入次数、超时与取消边界。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1200" height="820" fill="#f5f8f4"/><g font-family="system-ui,sans-serif" fill="#173b2d"><text x="40" y="48" font-size="28" font-weight="700">第一阶段：工具结果怎样推动下一次决策</text><text x="40" y="85" font-size="18">第 01 至 04 篇｜先跑通一条反馈循环，再加入次数、超时与取消边界。</text><rect x="40" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="184" font-size="23" font-weight="650">任务与运行状态</text><text x="58" y="222" font-size="18">用户：诊断 sum([]) 报错</text><text x="58" y="251" font-size="18">State 保存任务与历史</text><text x="58" y="280" font-size="18">新任务有独立的状态</text><rect x="450" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="184" font-size="23" font-weight="650">构造本轮输入</text><text x="468" y="222" font-size="18">从最新状态准备 Context</text><text x="468" y="251" font-size="18">给决策方当前可见信息</text><text x="468" y="280" font-size="18">控制字段仍由程序持有</text><rect x="860" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="184" font-size="23" font-weight="650">提出下一步动作</text><text x="878" y="222" font-size="18">本阶段用脚本扮演模型</text><text x="878" y="251" font-size="18">例如：读取源码 read-1</text><text x="878" y="280" font-size="18">提出动作不等于已经执行</text><rect x="860" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="464" font-size="23" font-weight="650">检查并执行工具</text><text x="878" y="502" font-size="18">查找工具、检查参数</text><text x="878" y="531" font-size="18">调用受控读取函数</text><text x="878" y="560" font-size="18">取得实际源码或错误</text><rect x="450" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="464" font-size="23" font-weight="650">关联工具结果</text><text x="468" y="502" font-size="18">结果带原调用 callId</text><text x="468" y="531" font-size="18">确认它属于 read-1</text><text x="468" y="560" font-size="18">成功与错误都要可区分</text><rect x="40" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="464" font-size="23" font-weight="650">循环写回 State</text><text x="58" y="502" font-size="18">追加一条 tool 观察</text><text x="58" y="531" font-size="18">下一轮才看得见源码</text><text x="58" y="560" font-size="18">拿到返回值不等于已保存</text><path d="M340 235 L450 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="223.0" text-anchor="middle" font-size="17">准备</text><path d="M750 235 L860 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="223.0" text-anchor="middle" font-size="17">交给决策</text><path d="M1010 315 L1010 430" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1022" y="372.5" text-anchor="start" font-size="17">工具请求</text><path d="M860 510 L750 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="498.0" text-anchor="middle" font-size="17">返回结果</text><path d="M450 510 L340 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="498.0" text-anchor="middle" font-size="17">核对后</text><path d="M190 430 L190 315" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="202" y="372.5" text-anchor="start" font-size="17">下一轮</text><rect x="40" y="680" width="1120" height="100" rx="12" fill="#e7f1e9"/><text x="60" y="718" font-size="18">结束路径：finish 要经过完成规则；工具成功本身不等于任务完成。</text><text x="60" y="749" font-size="18">停止路径：次数耗尽、超时、取消分别退出；迟到值不能继续污染已结束状态。</text></g></svg>