<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">新输入先排队，由循环在检查位置接入</title><desc id="desc">运行中的用户消息先进入实例队列。循环在下一次决策前取出补充要求，在准备完成时取出追问；写为用户消息后才构造模型输入。暂停等待当前步骤结束后返回状态快照，继续时沿用它。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3e6857"/></marker></defs><rect width="1100" height="550" rx="18" fill="#f5f8f5"/><g font-family="system-ui,sans-serif" fill="#183a2d"><text x="35" y="43" font-size="24" font-weight="700">本篇新增：接入新输入，或在完整步骤后暂停</text><rect x="35" y="80" width="290" height="225" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="55" y="115" font-size="21" font-weight="700">实例接收用户操作</text><text x="55" y="160" font-size="19">补充当前要求 → 排队</text><text x="55" y="203" font-size="19">接着问一件事 → 排队</text><text x="55" y="246" font-size="19">请求暂停 → 保存请求标志</text><path d="M330 188H402" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/><rect x="418" y="80" width="645" height="310" rx="12" fill="white" stroke="#7fa58c"/><text x="443" y="115" font-size="21" font-weight="700">已有 Runtime 循环</text><text x="443" y="159" font-size="19">下一轮前：检查暂停，取出补充要求</text><text x="443" y="203" font-size="19">写入 State → 准备 Context → 决策</text><text x="443" y="247" font-size="19">工具请求 → 等整批结束 → 结果写回 → 回到上方</text><text x="443" y="291" font-size="19">完成请求 → 检查新要求与证据</text><text x="443" y="335" font-size="19">有追问：写回后继续；没有：返回 completed</text><rect x="35" y="420" width="1028" height="88" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="55" y="454" font-size="19">暂停：本段调用返回 paused 与状态副本 → 等待用户输入 → 从同一历史继续</text><text x="55" y="486" font-size="17">不抢占当前模型请求或工具批次；只在同一进程内续运行，不代表审批或崩溃恢复。</text><path d="M741 391V414" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/></g></svg>