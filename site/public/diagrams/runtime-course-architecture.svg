<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">Agent Runtime 总体架构</title><desc id="desc">应用提供任务和规则，Agent实例管理生命周期，循环通过模型适配器取得动作，通过执行门禁调用工具，把结果写回状态。状态与输入、保存恢复、运行控制与事件共同支撑运行，评估从外部验证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1440" height="1160" fill="#f5f8f4"/><g font-family="system-ui,sans-serif" fill="#173b2d"><text x="40" y="48" font-size="30" font-weight="700">Agent Runtime 总体架构</text><text x="40" y="80" font-size="18">从任务进入，到模型决策、受控执行、结果反馈，再到保存与退出。</text><rect x="260" y="270" width="920" height="610" rx="18" fill="#e7f1e9" stroke="#39755c" stroke-width="2"/><text x="280" y="299" font-size="18" font-weight="650">Runtime 边界：本系列逐步实现的运行机制</text><rect x="400" y="110" width="640" height="100" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="416" y="141" font-size="21" font-weight="650">应用层：定义任务与规则</text><text x="416" y="173" font-size="17">目标、可用工具、当前权限、完成标准；通过组装入口连接依赖</text><path d="M720 210 L720 315" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730" y="262.5" text-anchor="start" font-size="15">启动任务</text><rect x="300" y="315" width="840" height="100" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="316" y="346" font-size="21" font-weight="650">Agent 运行实例</text><text x="316" y="378" font-size="17">启动／订阅／取消／暂停／继续；调用原循环，并等待结果保存</text><path d="M720 415 L720 470" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730" y="442.5" text-anchor="start" font-size="15">驱动</text><rect x="300" y="470" width="240" height="150" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="316" y="501" font-size="21" font-weight="650">模型适配器</text><text x="316" y="533" font-size="17">转换消息与工具协议</text><text x="316" y="560" font-size="17">解析完整动作、传输重试</text><text x="316" y="587" font-size="17">adapters/deepseek/</text><rect x="600" y="470" width="240" height="150" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="616" y="501" font-size="21" font-weight="650">Agent Loop 循环</text><text x="616" y="533" font-size="17">记录动作，安排执行</text><text x="616" y="560" font-size="17">写回结果，再决策或退出</text><text x="616" y="587" font-size="17">runtime/agent-loop.ts</text><rect x="900" y="470" width="240" height="150" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="916" y="501" font-size="21" font-weight="650">工具执行门禁</text><text x="916" y="533" font-size="17">注册、参数、权限与批准</text><text x="916" y="560" font-size="17">获准后留执行意图再调用</text><text x="916" y="587" font-size="17">tool-* / authorization</text><rect x="30" y="470" width="200" height="150" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="46" y="501" font-size="21" font-weight="650">模型服务</text><text x="46" y="533" font-size="17">真实 DeepSeek API</text><text x="46" y="560" font-size="17">或可控离线响应</text><text x="46" y="587" font-size="17">只提议，不直接执行</text><rect x="1210" y="470" width="200" height="150" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="1226" y="501" font-size="21" font-weight="650">外部工具</text><text x="1226" y="533" font-size="17">读取文件等具体能力</text><text x="1226" y="560" font-size="17">由应用提供执行体</text><text x="1226" y="587" font-size="17">返回关联调用的结果</text><path d="M600 510 L540 510" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570.0" y="499.0" text-anchor="middle" font-size="15">输入</text><path d="M540 565 L600 565" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570.0" y="554.0" text-anchor="middle" font-size="15">动作</text><path d="M300 510 L230 510" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="265.0" y="499.0" text-anchor="middle" font-size="15">请求</text><path d="M230 565 L300 565" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="265.0" y="554.0" text-anchor="middle" font-size="15">响应</text><path d="M840 510 L900 510" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="870.0" y="499.0" text-anchor="middle" font-size="15">请求</text><path d="M900 565 L840 565" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="870.0" y="554.0" text-anchor="middle" font-size="15">结果</text><path d="M1140 510 L1210 510" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1175.0" y="499.0" text-anchor="middle" font-size="15">执行</text><path d="M1210 565 L1140 565" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1175.0" y="554.0" text-anchor="middle" font-size="15">观察</text><rect x="300" y="705" width="240" height="135" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="316" y="736" font-size="21" font-weight="650">State 与 Context</text><text x="316" y="768" font-size="17">State 保存任务事实</text><text x="316" y="795" font-size="17">Context 是本轮模型输入</text><text x="316" y="822" font-size="17">runtime/context* / types</text><rect x="600" y="705" width="240" height="135" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="616" y="736" font-size="21" font-weight="650">会话保存与恢复</text><text x="616" y="768" font-size="17">日志、检查点、确认边界</text><text x="616" y="795" font-size="17">恢复前核对当前环境</text><text x="616" y="822" font-size="17">session-* / recovery-*</text><rect x="900" y="705" width="240" height="135" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="916" y="736" font-size="21" font-weight="650">运行控制与事件</text><text x="916" y="768" font-size="17">时间、取消、暂停、预算</text><text x="916" y="795" font-size="17">阶段报告与运行身份</text><text x="916" y="822" font-size="17">run-control / events</text><path d="M620 620 L520 705" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570.0" y="651.5" text-anchor="middle" font-size="15">写回事实</text><path d="M420 705 L420 620" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="430" y="662.5" text-anchor="start" font-size="15">下轮输入</text><rect x="260" y="960" width="920" height="105" rx="12" fill="white" stroke="#79a18d" stroke-width="1.6"/><text x="276" y="991" font-size="21" font-weight="650">外部评估：检查同一个 Runtime 的行为</text><text x="276" y="1023" font-size="17">evaluation/ 运行完整场景，检查状态、实际调用、文件与退出结果；不替代业务循环。</text><path d="M720 960 L720 880" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="730" y="920.0" text-anchor="start" font-size="15">检查</text><text x="40" y="1110" font-size="17">实线突出模型、工具与状态的反馈路径；保存恢复和运行控制共同支撑 Agent 生命周期。</text><text x="40" y="1138" font-size="17">这是课程最终结构。第 00 篇先搭工程；图中能力从第 01 篇起逐步实现，范围是单机 Runtime。</text></g></svg>