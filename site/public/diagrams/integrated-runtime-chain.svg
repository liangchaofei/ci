<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">一条任务怎样经过现有 Runtime</title><desc id="desc">createRuntimeSession 负责连接；原 Agent Loop 仍负责动作记录、调度、反馈与退出。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1100" height="100%" fill="#f5f8f4"/><g font-family="system-ui, sans-serif" fill="#173b2d"><text x="40" y="45" font-size="25" font-weight="700">一条任务怎样经过现有 Runtime</text><text x="40" y="78" font-size="17">createRuntimeSession 负责连接；原 Agent Loop 仍负责动作记录、调度、反馈与退出。</text><rect x="40" y="130" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="162" font-size="20" font-weight="650">State → Context</text><text x="58" y="194" font-size="17">保存完整消息与决策次数</text><text x="58" y="220" font-size="17">构造本轮模型输入副本</text><text x="58" y="246" font-size="17">context.ts / context-window.ts</text><rect x="400" y="130" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="162" font-size="20" font-weight="650">DeepSeek 适配器</text><text x="418" y="194" font-size="17">消息转换、传输重试与记账</text><text x="418" y="220" font-size="17">本章 fetch 使用离线服务</text><text x="418" y="246" font-size="17">解码为完整 Action</text><rect x="760" y="130" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="162" font-size="20" font-weight="650">原 agent-loop.ts</text><text x="778" y="194" font-size="17">记录取得的 Action</text><text x="778" y="220" font-size="17">finish → 完成规则核对</text><text x="778" y="246" font-size="17">tools → 进入执行门禁</text><rect x="40" y="370" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="402" font-size="20" font-weight="650">结果写回 State</text><text x="58" y="434" font-size="17">整批确认后追加 tool 消息</text><text x="58" y="460" font-size="17">下一轮据此构造 Context</text><text x="58" y="486" font-size="17">报告观察不代替写回</text><rect x="400" y="370" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="402" font-size="20" font-weight="650">原工具执行入口</text><text x="418" y="434" font-size="17">注册查找与参数校验</text><text x="418" y="460" font-size="17">读取私人工作区的文件</text><text x="418" y="486" font-size="17">返回关联 callId 的结果</text><rect x="760" y="370" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="402" font-size="20" font-weight="650">授权 → 保存意图</text><text x="778" y="434" font-size="17">当前策略与资源检查</text><text x="778" y="460" font-size="17">store.wrap 先保存调用身份</text><text x="778" y="486" font-size="17">再允许实际执行</text><path d="M340 200 L400 200" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="370.0" y="188.0" text-anchor="middle" font-size="16">输入</text><path d="M700 200 L760 200" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730.0" y="188.0" text-anchor="middle" font-size="16">动作</text><path d="M910 280 L910 370" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="920.0" y="325.0" text-anchor="start" font-size="16">工具请求</text><path d="M760 445 L700 445" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730.0" y="433.0" text-anchor="middle" font-size="16">获准</text><path d="M400 445 L340 445" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="370.0" y="433.0" text-anchor="middle" font-size="16">结果</text><path d="M190 370 L190 280" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200.0" y="325.0" text-anchor="start" font-size="16">下一轮</text><text x="40" y="570" font-size="17">完成出口：Loop 返回 → Agent 等待 resultSink.save → 应用接住结果 → 保存报告并 close。</text><text x="40" y="597" font-size="17">requests 与 trace 收集各自的副本；既不修改 State，也不授予工具权限。</text><text x="40" y="624" font-size="17">本图展示本章只读主线；写入审批、流式与并行仍由对应章节单独验证。</text></g></svg>