<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">第四阶段：用证据检查，再把系统连起来</title><desc id="desc">第 16 至 17 篇｜完整场景评估、故障注入与同一组装入口的系统复盘。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1200" height="820" fill="#f5f8f4"/><g font-family="system-ui,sans-serif" fill="#173b2d"><text x="40" y="48" font-size="28" font-weight="700">第四阶段：用证据检查，再把系统连起来</text><text x="40" y="85" font-size="18">第 16 至 17 篇｜完整场景评估、故障注入与同一组装入口的系统复盘。</text><rect x="40" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="184" font-size="23" font-weight="650">先写场景与期望</text><text x="58" y="222" font-size="18">正常多轮、权限拒绝</text><text x="58" y="251" font-size="18">断流、迟到、乱序返回</text><text x="58" y="280" font-size="18">崩溃与跨进程接续</text><rect x="450" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="184" font-size="23" font-weight="650">控制实际运行条件</text><text x="468" y="222" font-size="18">固定模型响应或故障点</text><text x="468" y="251" font-size="18">使用真实文件和子进程</text><text x="468" y="280" font-size="18">不直接伪造最终 Outcome</text><rect x="860" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="184" font-size="23" font-weight="650">运行原 Runtime</text><text x="878" y="222" font-size="18">模型 → 门禁 → 工具</text><text x="878" y="251" font-size="18">结果 → State → 下一轮</text><text x="878" y="280" font-size="18">整合时复用同一组装入口</text><rect x="860" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="464" font-size="23" font-weight="650">收集实际证据</text><text x="878" y="502" font-size="18">最终结果与事件轨迹</text><text x="878" y="531" font-size="18">实际请求输入和次数</text><text x="878" y="560" font-size="18">文件变化与会话记录</text><rect x="450" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="464" font-size="23" font-weight="650">逐项应用判定规则</text><text x="468" y="502" font-size="18">从证据提取实际值</text><text x="468" y="531" font-size="18">与运行前期望比较</text><text x="468" y="560" font-size="18">不符或检查异常都算失败</text><rect x="40" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="464" font-size="23" font-weight="650">保留报告，定位差异</text><text x="58" y="502" font-size="18">检查哪条事实首次偏离</text><text x="58" y="531" font-size="18">区分任务失败与评估失败</text><text x="58" y="560" font-size="18">回到对应 Runtime 模块</text><path d="M340 235 L450 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="223.0" text-anchor="middle" font-size="17">设置</text><path d="M750 235 L860 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="223.0" text-anchor="middle" font-size="17">启动</text><path d="M1010 315 L1010 430" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1022" y="372.5" text-anchor="start" font-size="17">得到事实</text><path d="M860 510 L750 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="498.0" text-anchor="middle" font-size="17">判定</text><path d="M450 510 L340 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="498.0" text-anchor="middle" font-size="17">汇总</text><rect x="40" y="680" width="1120" height="100" rx="12" fill="#e7f1e9"/><text x="60" y="718" font-size="18">正常任务 completed 仍可能不符合规则；预期被拒绝的任务 failed 也可以通过评估。</text><text x="60" y="749" font-size="18">单机场景通过证明声明范围内的行为；不代表真实模型通用能力或生产平台验证通过。</text></g></svg>