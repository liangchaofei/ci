<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title"><title id="title">先限制传输启动，再记录报告和决定是否交付候选结果</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f5f8f5"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.t{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.a{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style><text x="28" y="42" class="t">第 16 篇：能提前判断的先拦，已发生的先记</text><rect x="50" y="90" width="650" height="82" rx="12" class="box"/><text x="68" y="122" class="b">原循环：准备这一次决策</text><text x="68" y="150" class="s">仍用已有 Context；资源账本在应用持有，不放进 State</text><rect x="50" y="225" width="650" height="108" rx="12" class="box"/><text x="68" y="257" class="b">启动前：检查请求次数、并发和已知额度</text><text x="68" y="285" class="s">通过 → 占用一次请求与活动名额 → 发 HTTP</text><text x="68" y="313" class="s">拒绝 → 不发请求，返回资源不足</text><rect x="50" y="395" width="650" height="110" rx="12" class="box"/><text x="68" y="427" class="b">响应到达：解析并累计服务报告</text><text x="68" y="455" class="s">用量有效 → 累计 token 与估算费用</text><text x="68" y="483" class="s">报告超额 → 保留账目，停止交付这次候选响应</text><rect x="50" y="565" width="650" height="82" rx="12" class="box"/><text x="68" y="597" class="b">finally：释放活动名额</text><text x="68" y="625" class="s">没有报告 → 另记未报告请求，不填成零费用</text><rect x="50" y="715" width="650" height="108" rx="12" class="box"/><text x="68" y="747" class="b">额度允许：候选响应交回原动作解析</text><text x="68" y="775" class="s">原循环记录 Action，执行许可工具，再写 tool 观察</text><text x="68" y="803" class="s">下一轮仍使用同一份账本；不重置为零</text><path class="a" d="M360 172V225"/><path class="a" d="M360 333V395"/><path class="a" d="M360 505V565"/><path class="r" d="M360 647V715"/><text x="390" y="685" class="s">返回候选值</text><rect x="750" y="395" width="260" height="140" rx="12" class="box"/><text x="768" y="427" class="b">非流式 503 等失败</text><text x="768" y="455" class="s">无报告 → 保留未知</text><text x="768" y="483" class="s">可重试才重新领名额</text><text x="768" y="511" class="s">流式断流不自动重发</text><path class="r" d="M700 600H880V535"/><path class="a" d="M880 395V275H700"/><text x="760" y="245" class="s">重试仍重新领名额</text></svg>