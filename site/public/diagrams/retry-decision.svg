<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" role="img" aria-labelledby="title"><title id="title">单个依赖失败后，只有原因暂时、操作可重复且仍有次数才继续</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f5f8f5"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.t{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.a{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style><text x="28" y="42" class="t">第 15 篇：重试一项依赖，不重跑整个 Agent</text><rect x="60" y="85" width="540" height="80" rx="12" class="box"/><text x="78" y="117" class="b">开始本次尝试</text><text x="78" y="145" class="s">先检查取消，再核对当前访问许可</text><rect x="60" y="220" width="540" height="78" rx="12" class="box"/><text x="78" y="252" class="b">调用这一个依赖</text><text x="78" y="280" class="s">成功 → 返回最终值，不再尝试</text><rect x="60" y="355" width="540" height="110" rx="12" class="box"/><text x="78" y="387" class="b">失败：读取可信分类</text><text x="78" y="415" class="s">可重复 + 暂时失败 + 还有次数？</text><text x="78" y="443" class="s">缺少任一条件 → 结束，交回错误</text><rect x="60" y="540" width="540" height="100" rx="12" class="box"/><text x="78" y="572" class="b">计算有上限的等待，报告准备重试</text><text x="78" y="600" class="s">指数退避 + 随机分散；尊重服务最少等待</text><text x="78" y="628" class="s">等待中取消 → 结束，不开始下一次</text><path class="a" d="M330 165V220"/><path class="a" d="M330 298V355"/><path class="a" d="M330 465V540"/><path class="r" d="M600 590H790V125H600"/><text x="640" y="355" class="s">等待结束</text><text x="640" y="382" class="s">下一次尝试</text><text x="60" y="710" class="s">许可核对失败直接停止；未知写入不能因“暂时失败”自动重放。</text><text x="60" y="745" class="s">最终值 / 错误仍沿原调用链返回，只有原循环写 State。</text></svg>