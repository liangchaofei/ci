<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" role="img" aria-labelledby="title desc">
<title id="title">运行步骤旁边增加通知通道</title><desc id="desc">原有循环仍准备输入、请求决策、执行工具和写入状态。在关键步骤向显示器与轨迹记录器发送通知。观察者不负责执行下一步。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3e6857"/></marker></defs>
<rect width="1050" height="520" rx="20" fill="#f5f8f5"/>
<g font-family="system-ui, sans-serif" fill="#183a2d">
<text x="40" y="43" font-size="24" font-weight="700">本篇新增：让外部看见运行过程</text>
<rect x="40" y="76" width="595" height="365" rx="14" fill="white" stroke="#7fa58c"/>
<text x="65" y="110" font-size="20" font-weight="700">已有 Runtime：仍由循环驱动下一步</text>
<g font-size="19">
<text x="78" y="157">准备 Context → 请求决策</text>
<text x="78" y="218">动作检查 → 记录到 State</text>
<text x="78" y="279">执行工具 → 结果写入 State</text>
<text x="78" y="340">再次决策 → 验证完成或明确退出</text>
</g>
<g stroke="#3e6857" stroke-width="2" marker-end="url(#arrow)"><path d="M150 168V195"/><path d="M150 229V256"/><path d="M150 290V317"/></g>
<text x="67" y="405" font-size="17">State 保存事实；Context 是每轮提供给模型的输入</text>
<path d="M636 238H707" stroke="#3e6857" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646" y="219" font-size="16">通知</text>
<rect x="720" y="112" width="285" height="270" rx="14" fill="#e2f0e7" stroke="#7fa58c"/>
<text x="745" y="151" font-size="21" font-weight="700">新增的观察通道</text>
<text x="745" y="197" font-size="18">显示当前正在做什么</text>
<text x="745" y="244" font-size="18">保存按顺序到达的报告</text>
<text x="745" y="291" font-size="18">结束后检查最后走到哪步</text>
<text x="745" y="345" font-size="16">不写 State，不替循环作决策</text>
<text x="40" y="485" font-size="17">图中省略取消与失败分支；本章报告保存在内存，不代表已写入磁盘。</text>
</g></svg>