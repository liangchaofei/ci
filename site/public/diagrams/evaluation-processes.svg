<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">全量运行：每个场景独立进程，父进程核对证据</title><desc id="desc">每项使用新的工作目录；恢复场景还会启动保存、接续或崩溃演示进程。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1100" height="100%" fill="#f5f8f4"/><g font-family="system-ui, sans-serif" fill="#173b2d"><text x="40" y="45" font-size="26" font-weight="700">全量运行：每个场景独立进程，父进程核对证据</text><text x="40" y="78" font-size="17">每项使用新的工作目录；恢复场景还会启动保存、接续或崩溃演示进程。</text><rect x="40" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="152" font-size="20" font-weight="650">父进程 runEvaluations</text><text x="58" y="184" font-size="17">从已知清单选择场景</text><text x="58" y="210" font-size="17">创建独立 caseDirectory</text><text x="58" y="236" font-size="17">启动固定 case-worker.ts</text><rect x="400" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="152" font-size="20" font-weight="650">子进程 case-worker</text><text x="418" y="184" font-size="17">按 ID 调用 definition.run</text><text x="418" y="210" font-size="17">运行原 Agent 与依赖</text><text x="418" y="236" font-size="17">写出 evidence.json</text><rect x="760" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="152" font-size="20" font-weight="650">父进程收集与判定</text><text x="778" y="184" font-size="17">读取并检查 JSON 形状</text><text x="778" y="210" font-size="17">grade 比较规则</text><text x="778" y="236" font-size="17">保存日志、verdict 和总报告</text><rect x="400" y="340" width="300" height="120" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="372" font-size="20" font-weight="650">恢复场景内部子进程</text><text x="418" y="404" font-size="17">recovery-leg：save / resume</text><text x="418" y="430" font-size="17">crash-after-write：写后退出</text><path d="M340 170 L400 170" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="376.0" y="162.0" font-size="16">启动</text><path d="M700 220 L760 220" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="706" y="195" font-size="16">证据文件</text><path d="M550 270 L550 340" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="556.0" y="297.0" font-size="16">等待退出</text><text x="40" y="525" font-size="17">子进程超时或异常：本项失败，保留输出，继续其他场景。</text><text x="40" y="552" font-size="17">工作目录与进程分离用于复现；这里没有提供恶意代码安全沙箱或进程树隔离。</text></g></svg>