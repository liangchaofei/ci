<svg xmlns="http://www.w3.org/2000/svg" width="800" height="665" viewBox="0 0 800 665" role="img" aria-labelledby="title desc"><title id="title">架构图：谁提供能力，谁组织运行</title><desc id="desc">第 03 篇当前实现。应用提供目标、依赖和上限；Runtime 持有状态、准备输入并调度；外部函数提供决策、执行和完成规则。真实模型、事件、恢复等尚未实现。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="665" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="42" font-size="25" fill="#203b35" font-weight="700" text-anchor="start">架构图：谁提供能力，谁组织运行</text><text x="32" y="75" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">当前实现：模型决策与文件读取均由固定场景模拟</text><rect x="30" y="160" width="185" height="250" rx="12" fill="#edf3fa" stroke="#c1d2e8" stroke-width="1.5"/><text x="48" y="192" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">应用入口</text><text x="48" y="222" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">first-loop.ts</text><text x="48" y="249" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">目标 goal</text><text x="48" y="276" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">依赖 dependencies</text><text x="48" y="303" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">次数上限</text><rect x="265" y="125" width="280" height="380" rx="12" fill="#edf7f1" stroke="#8fbca7" stroke-width="1.5"/><text x="283" y="157" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">Runtime</text><rect x="285" y="185" width="240" height="80" rx="12" fill="#ffffff" stroke="#ccd9d2" stroke-width="1.5"/><text x="303" y="217" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">运行记录 State</text><text x="303" y="247" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">goal · messages · decisions</text><rect x="285" y="290" width="240" height="80" rx="12" fill="#ffffff" stroke="#ccd9d2" stroke-width="1.5"/><text x="303" y="322" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">输入准备</text><text x="303" y="352" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">context.ts → 本轮消息</text><rect x="285" y="395" width="240" height="80" rx="12" fill="#ffffff" stroke="#ccd9d2" stroke-width="1.5"/><text x="303" y="427" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">循环调度</text><text x="303" y="457" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">agent-loop.ts → 继续或退出</text><rect x="595" y="160" width="175" height="250" rx="12" fill="#fff8e9" stroke="#e3cf9f" stroke-width="1.5"/><text x="613" y="192" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">场景提供函数</text><text x="613" y="222" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">decide</text><text x="613" y="249" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">executeTool</text><text x="613" y="276" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">validateFinish</text><polyline points="215,265 263,265" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="239" y="241" font-size="14" fill="#52675f" font-weight="400" text-anchor="middle">传入</text><polyline points="545,255 593,255" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="569" y="232" font-size="14" fill="#386ca5" font-weight="400" text-anchor="middle">调用</text><polyline points="595,350 547,350" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="570" y="377" font-size="14" fill="#386ca5" font-weight="400" text-anchor="middle">返回</text><text x="405" y="543" font-size="16" fill="#203b35" font-weight="400" text-anchor="middle">状态由循环持有和更新，具体能力从外部传入</text><rect x="30" y="575" width="740" height="62" rx="12" fill="#f0f2f1" stroke="#ccd9d2" stroke-width="1.5"/><text x="48" y="607" font-size="17" fill="#203b35" font-weight="650" text-anchor="start">后续接入：真实模型、工具注册、运行控制、事件与会话恢复</text></g></svg>