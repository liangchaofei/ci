<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">一次任务结束以后，怎样判断场景通过？</title><desc id="desc">实线表示数据传递；期望在运行前定义，实际证据来自原 Runtime 与运行环境。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1100" height="100%" fill="#f5f8f4"/><g font-family="system-ui, sans-serif" fill="#173b2d"><text x="40" y="45" font-size="26" font-weight="700">一次任务结束以后，怎样判断场景通过？</text><text x="40" y="78" font-size="17">实线表示数据传递；期望在运行前定义，实际证据来自原 Runtime 与运行环境。</text><rect x="40" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="152" font-size="20" font-weight="650">场景调用原 Agent</text><text x="58" y="184" font-size="17">固定响应或故障条件</text><text x="58" y="210" font-size="17">原模型适配器、循环与执行入口</text><text x="58" y="236" font-size="17">返回实际 RunResult</text><rect x="400" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="152" font-size="20" font-weight="650">收集 Evidence</text><text x="418" y="184" font-size="17">result：实际任务记录</text><text x="418" y="210" font-size="17">trace：实例事件摘要</text><text x="418" y="236" font-size="17">facts：请求、账本或文件事实</text><rect x="760" y="120" width="300" height="150" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="152" font-size="20" font-weight="650">grade 判定</text><text x="778" y="184" font-size="17">逐项提取 actual</text><text x="778" y="210" font-size="17">与预先定义的 expected 比较</text><text x="778" y="236" font-size="17">全部满足才 passed=true</text><rect x="400" y="330" width="300" height="110" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="362" font-size="20" font-weight="650">运行前定义 criteria</text><text x="418" y="394" font-size="17">核对什么，以及期望什么</text><rect x="760" y="330" width="300" height="110" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="362" font-size="20" font-weight="650">保存与汇总</text><text x="778" y="394" font-size="17">evidence.json / verdict.json</text><text x="778" y="420" font-size="17">全量生成 report.json</text><path d="M340 195 L400 195" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700 195 L760 195" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700 380 L760 255" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="736.0" y="309.5" font-size="16">规则</text><path d="M910 270 L910 330" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="495" font-size="17">例：断流任务返回 failed，且从未执行工具 → 满足预期，场景通过。</text><text x="40" y="522" font-size="17">任务 completed 但下一次模型输入漏掉源码 → 不满足规则，场景失败。</text></g></svg>