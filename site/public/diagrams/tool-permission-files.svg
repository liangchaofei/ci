<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title"><title id="title">主进程持有状态与批准，子进程只完成固定文件操作</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.title{font-size:26px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.arrow{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="42" class="title">调用位置与数据归属</text><rect x="20" y="65" width="610" height="700" rx="16" fill="#edf5ef"/><text x="40" y="98" class="body">主进程：Agent、State、当前策略与批准等待</text><rect x="50" y="125" width="550" height="76" rx="12" class="box"/><text x="70" y="159" class="body">approve-file-change.ts：组装原 Agent</text><text x="70" y="188" class="small">decide / validateFinish 来自 permission-scenario.ts</text><rect x="50" y="260" width="550" height="76" rx="12" class="box"/><text x="70" y="294" class="body">原 agent-loop.ts → executeTool</text><text x="70" y="323" class="small">请求已记录，结果由这个循环统一写回</text><rect x="50" y="398" width="550" height="110" rx="12" class="box"/><text x="70" y="432" class="body">authorization.ts：执行前的许可入口</text><text x="70" y="461" class="small">inspect → approve → 再次 inspect → execute</text><text x="70" y="490" class="small">permission-workspace.ts 提供检查器与工具</text><rect x="50" y="570" width="550" height="105" rx="12" class="box"/><text x="70" y="604" class="body">原注册表和工具 → file-process.ts</text><text x="70" y="633" class="small">execFile 固定脚本，stdin 发送 FileRequest</text><text x="70" y="662" class="small">cwd 不等于隔离；权限通过启动参数授予</text><rect x="675" y="398" width="260" height="135" rx="12" class="box"/><text x="695" y="432" class="body">独立子进程</text><text x="695" y="461" class="small">file-worker.ts</text><text x="695" y="490" class="small">仅固定 sum.ts 的读 / 写</text><text x="695" y="519" class="small">不持有 State / Context</text><path class="arrow" d="M275 201V260"/><path class="arrow" d="M275 336V398"/><path class="arrow" d="M275 508V570"/><path class="arrow" d="M600 610H805V533"/><text x="670" y="640" class="small">JSON 请求</text><path class="back" d="M675 445H645V710H490V675"/><text x="665" y="736" class="small">JSON 结果 → ToolResult</text><path class="back" d="M50 615H34V300H50"/><text x="65" y="737" class="small">虚线：返回值沿原调用链回到循环，再写入 State</text></svg>