<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1130" viewBox="0 0 800 1130" role="img" aria-labelledby="title desc"><title id="title">停止信号来自哪里，在哪阻止继续提交</title><desc id="desc">外部AbortController或本次计时器触发RunControl内部信号。循环通过wait分别等待决策和工具，依赖收到信号。取得结果后通过check才能记录；取消或超时直接返回停止原因，迟到值不写回。决策和文件读取仍是模拟的。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="1130" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="25" fill="#203b35" font-weight="700">停止信号来自哪里，在哪阻止继续提交</text><text x="30" y="77" font-size="16" fill="#52675f" font-weight="400">第 04 篇当前实现 · 等待保护与工具配合是两个层次</text><rect x="30" y="110" width="350" height="110" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="47" y="141" font-size="19" fill="#203b35" font-weight="650">调用方主动取消</text><text x="47" y="170" font-size="16" fill="#52675f" font-weight="400">外部 controller.abort()</text><text x="47" y="196" font-size="16" fill="#52675f" font-weight="400">记录 cancelled</text><rect x="420" y="110" width="350" height="110" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="437" y="141" font-size="19" fill="#203b35" font-weight="650">本次运行时间用完</text><text x="437" y="170" font-size="16" fill="#52675f" font-weight="400">累计 timeoutMs</text><text x="437" y="196" font-size="16" fill="#52675f" font-weight="400">记录 timed-out</text><rect x="30" y="290" width="740" height="110" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="47" y="321" font-size="19" fill="#203b35" font-weight="650">RunControl 持有本次控制状态</text><text x="47" y="350" font-size="16" fill="#52675f" font-weight="400">内部 signal 通知两个等待入口与具体依赖</text><text x="47" y="376" font-size="16" fill="#52675f" font-weight="400">第一项被记录的停止原因保留，不写入模型 Context</text><polyline points="205,220 205,288" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="595,220 595,288" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="470" width="350" height="135" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="47" y="501" font-size="19" fill="#203b35" font-weight="650">等待决策</text><text x="47" y="530" font-size="16" fill="#52675f" font-weight="400">control.wait → decide</text><text x="47" y="556" font-size="16" fill="#52675f" font-weight="400">正常交出 Action</text><text x="47" y="582" font-size="16" fill="#52675f" font-weight="400">signal 作为第二个参数</text><rect x="420" y="470" width="350" height="135" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="437" y="501" font-size="19" fill="#203b35" font-weight="650">等待工具</text><text x="437" y="530" font-size="16" fill="#52675f" font-weight="400">control.wait → executeTool</text><text x="437" y="556" font-size="16" fill="#52675f" font-weight="400">正常交出 ToolResult</text><text x="437" y="582" font-size="16" fill="#52675f" font-weight="400">继续传给 invoke → execute</text><polyline points="205,400 205,468" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="595,400 595,468" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="290" y="443" font-size="16" fill="#386ca5" font-weight="400">同一内部停止信号</text><rect x="30" y="685" width="470" height="130" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="47" y="716" font-size="19" fill="#203b35" font-weight="650">循环：提交前 check</text><text x="47" y="745" font-size="16" fill="#52675f" font-weight="400">正常取得值，且本次运行仍可继续</text><text x="47" y="771" font-size="16" fill="#52675f" font-weight="400">才记录 assistant 或 tool 消息</text><text x="47" y="797" font-size="16" fill="#52675f" font-weight="400">State 仍只由循环更新</text><rect x="540" y="685" width="230" height="130" rx="12" fill="#fff5e5" stroke="#c4d5cd"/><text x="557" y="716" font-size="19" fill="#203b35" font-weight="650">等待中或提交前停止</text><text x="557" y="745" font-size="16" fill="#52675f" font-weight="400">返回 cancelled</text><text x="557" y="771" font-size="16" fill="#52675f" font-weight="400">或 timed-out</text><text x="557" y="797" font-size="16" fill="#52675f" font-weight="400">不伪造工具结果</text><polyline points="205,605 205,683" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="595,605 595,650 400,650 400,683" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="500,750 538,750" fill="none" stroke="#9a6719" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="885" width="740" height="100" rx="12" fill="#f0f2f1" stroke="#c4d5cd"/><text x="47" y="916" font-size="19" fill="#203b35" font-weight="650">运行退出后：迟到值不再进入 State</text><text x="47" y="945" font-size="16" fill="#52675f" font-weight="400">外部操作是否真的停止，仍取决于工具与底层 API；不会自动回滚文件</text><polyline points="655,815 655,883" fill="none" stroke="#9a6719" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="1031" font-size="16" fill="#203b35" font-weight="400">图中并列展示两个等待位置，不表示决策与工具并行执行。</text><text x="30" y="1065" font-size="16" fill="#203b35" font-weight="400">正常消息顺序仍为 user → assistant → tool → 再次决策。</text><text x="30" y="1097" font-size="15" fill="#52675f" font-weight="400">省略完成验证与预算分支；真实模型与会话恢复后续实现。</text></g></svg>