<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="840" viewBox="0 0 1140 840" role="img" aria-labelledby="title desc"><title id="title">第 13 篇文件怎样接入同一次恢复</title><desc id="desc">入口先取得当前环境并调用恢复读取器，decision 返回入口。通过后入口安装并继续 Agent，Agent 调用原循环，循环返回 RunResult。Agent 在循环前调用恢复保存器 begin，在循环后调用 save。读取器复用原会话读取与校验模块。仅画正常恢复主线，不画本例未发生的新工具执行。</desc><defs><marker id="call" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#316b50"/></marker><marker id="back" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#346b99"/></marker></defs><rect width="1140" height="840" rx="18" fill="#f5f8f5"/><g font-family="system-ui,sans-serif" fill="#183a2d"><text x="35" y="43" font-size="25" font-weight="700">这些文件在同一次恢复里怎样连接</text><rect x="40" y="85" width="390" height="145" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="117" font-size="20" font-weight="700">应用入口：resume-session.ts</text><text x="58" y="150" font-size="17">先调用 recovery-workspace.ts</text><text x="58" y="179" font-size="17">取得 current（当前资源与工具清单）</text><text x="58" y="208" font-size="17">再检查；通过后才创建实例</text><rect x="650" y="85" width="390" height="145" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="668" y="117" font-size="20" font-weight="700">运行实例：agent.ts</text><text x="668" y="150" font-size="17">restore：安装暂停状态</text><text x="668" y="179" font-size="17">resume → start：开始新运行段</text><text x="668" y="208" font-size="17">等待开始准备、循环、结束保存</text><path d="M435 136H645" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><text x="451" y="113" font-size="17">ready 后才进入</text><text x="450" y="164" font-size="17">restore / resume</text><rect x="40" y="370" width="390" height="140" rx="11" fill="#fff" stroke="#87aa94"/><text x="58" y="402" font-size="20" font-weight="700">恢复检查：recovery-reader.ts</text><text x="58" y="435" font-size="17">inspectRecovery：只读旧目录</text><text x="58" y="464" font-size="17">核对结果、标记和当前环境</text><text x="58" y="493" font-size="17">交回 decision，不启动任务</text><path d="M85 235V365" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><text x="105" y="283" font-size="17">调用检查</text><text x="105" y="310" font-size="16">目录 + current</text><path d="M345 365V235" fill="none" stroke="#346b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#back)"/><text x="250" y="282" font-size="17" fill="#346b99">decision</text><text x="230" y="310" font-size="16" fill="#346b99">ready / blocked</text><rect x="650" y="370" width="390" height="140" rx="11" fill="#fff" stroke="#87aa94"/><text x="668" y="402" font-size="20" font-weight="700">原有循环：agent-loop.ts</text><text x="668" y="435" font-size="17">根据最新 State 构造 Context</text><text x="668" y="464" font-size="17">本例脚本已有材料，直接 finish</text><text x="668" y="493" font-size="17">写好 State，交回 RunResult</text><path d="M710 235V365" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><text x="730" y="283" font-size="17">调用循环</text><path d="M970 365V235" fill="none" stroke="#346b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#back)"/><text x="823" y="283" font-size="17" fill="#346b99">返回 RunResult</text><rect x="40" y="635" width="390" height="125" rx="11" fill="#fff" stroke="#87aa94"/><text x="58" y="667" font-size="20" font-weight="700">读取端使用的模块</text><text x="58" y="700" font-size="17">session-reader.ts：加载原段结果</text><text x="58" y="729" font-size="17">recovery-codec.ts：格式与比较</text><path d="M150 515V630" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><text x="170" y="568" font-size="17">读完整日志、检查格式</text><rect x="650" y="635" width="390" height="125" rx="11" fill="#fff" stroke="#87aa94"/><text x="668" y="667" font-size="20" font-weight="700">恢复写入器：recovery-store.ts</text><text x="668" y="700" font-size="17">begin：段开始前写 open</text><text x="668" y="729" font-size="17">save：原日志保存后核对 sealed</text><path d="M1044 186H1104V695H1045" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><text x="1048" y="355" font-size="16">Agent</text><text x="1048" y="385" font-size="16">直接</text><text x="1048" y="415" font-size="16">等待</text><text x="1048" y="445" font-size="16">begin</text><text x="1048" y="475" font-size="16">与</text><text x="1048" y="505" font-size="16">save</text><text x="35" y="800" font-size="18">实线：调用；蓝色虚线：返回。仅画本例主线：新段没有工具请求，执行器支路省略。</text></g></svg>