<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">运行结果从内存保存到磁盘，再由另一个进程读回</title><desc id="desc">循环先返回状态与退出原因，实例等待结果保存。写入器依次追加会话日志、同步文件并替换检查点，然后实例才返回。另一个只读进程扫描日志、核对检查点，重建状态与输入但不执行工具。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3e6857"/></marker></defs><rect width="1100" height="570" rx="18" fill="#f5f8f5"/><g font-family="system-ui,sans-serif" fill="#183a2d"><text x="35" y="43" font-size="24" font-weight="700">第 11 篇：保存已结束的一段运行，退出后还能检查</text><rect x="35" y="80" width="295" height="255" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="55" y="116" font-size="21" font-weight="700">运行进程：已有 Runtime</text><text x="55" y="165" font-size="18">循环：更新 State，选定 Outcome</text><text x="55" y="213" font-size="18">实例：取得 RunResult</text><text x="55" y="261" font-size="18">新增：等待保存完成，再返回</text><text x="55" y="307" font-size="16">过程通知继续显示，不负责落盘</text><path d="M335 205H400" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/><rect x="417" y="80" width="640" height="255" rx="12" fill="white" stroke="#7fa58c"/><text x="440" y="116" font-size="21" font-weight="700">本篇新增：磁盘保存</text><text x="440" y="165" font-size="19">① journal.jsonl：每段结果追加一条完整记录</text><text x="440" y="213" font-size="19">② 同步日志，再替换 checkpoint.json 最新副本</text><text x="440" y="261" font-size="19">③ 两步完成，保存 Promise 才成功</text><text x="440" y="307" font-size="16">日志是读取依据；检查点不能替代或覆盖日志事实</text><path d="M740 340V389" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="402" width="1022" height="118" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="55" y="440" font-size="21" font-weight="700">另一个进程：只读检查</text><text x="55" y="476" font-size="18">扫描完整日志行 → 核对版本、身份与状态 → 取得最后已保存结果 → 重建模型输入</text><text x="55" y="505" font-size="16">本篇不从磁盘自动执行模型或工具；运行中崩溃的安全续跑留到下一篇。</text></g></svg>