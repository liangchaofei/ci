<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">先核对恢复依据，再把暂停状态交给新实例</title><desc id="desc">旧会话只读。先核对恢复标记、完整日志、资源版本与当前工具清单；通过则在新目录安装暂停状态并显式继续，不通过则停止核查。执行前先登记调用，段结果落盘后才能确认结束。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3e6857"/></marker></defs><rect width="1100" height="620" rx="18" fill="#f5f8f5"/><g font-family="system-ui,sans-serif" fill="#183a2d"><text x="35" y="45" font-size="24" font-weight="700">第 12 篇：读回进度以后，先确认能不能继续</text><rect x="35" y="80" width="285" height="210" rx="12" fill="white" stroke="#7fa58c"/><text x="55" y="116" font-size="21" font-weight="700">旧会话：只读</text><text x="55" y="163" font-size="18">暂停结果与完整历史</text><text x="55" y="208" font-size="18">段标记与执行意图</text><text x="55" y="253" font-size="16">不在旧日志后追加新运行</text><path d="M325 184H385" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="80" width="660" height="210" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="425" y="116" font-size="21" font-weight="700">恢复检查：只给结论，不执行工具</text><text x="425" y="161" font-size="18">标记确认结束 + 对应最后一条完整暂停结果</text><text x="425" y="205" font-size="18">工作区身份与资源版本一致 + 当前工具清单一致</text><text x="425" y="252" font-size="16">读取 JSON 成功，只是检查的起点</text><path d="M550 295V345" stroke="#3e6857" stroke-width="2" marker-end="url(#a)"/><path d="M910 295V345" stroke="#a86c37" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="360" width="675" height="120" rx="12" fill="#e2f0e7" stroke="#7fa58c"/><text x="55" y="397" font-size="21" font-weight="700">通过：新目录 + 新实例</text><text x="55" y="433" font-size="18">安装旧暂停状态 → 加入继续要求 → 再决策</text><text x="55" y="465" font-size="16">本例保留已有两份结果，不重复读取</text><rect x="740" y="360" width="320" height="120" rx="12" fill="#fff0dc" stroke="#c39b68"/><text x="760" y="397" font-size="21" font-weight="700">阻止：先核查</text><text x="760" y="433" font-size="18">未知执行、资源或授权变化</text><text x="760" y="465" font-size="16">不自动重放，也不伪造成功</text><text x="35" y="540" font-size="18">写入顺序：段开始先标记 open → 工具前登记意图 → 结果落盘并核对 → sealed</text><text x="35" y="581" font-size="16">本篇不提供通用幂等、自动补偿、断电保证或完整权限与隔离。</text></g></svg>