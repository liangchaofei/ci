<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-labelledby="title"><title id="title">模型 HTTP 和只读执行体分别局部重试，原循环仍只接收最终动作与观察</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f5f8f5"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.t{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.a{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style><text x="28" y="42" class="t">两处局部重试，仍是一条 Runtime 运行链</text><rect x="60" y="90" width="830" height="80" rx="12" class="box"/><text x="78" y="122" class="b">原 Agent / agent-loop.ts：第 1 次 decide</text><text x="78" y="150" class="s">Context 不变；这一轮还没有取得完整 Action</text><rect x="60" y="225" width="830" height="105" rx="12" class="box"/><text x="78" y="257" class="b">decider.ts → http.ts → retry → fetch</text><text x="78" y="285" class="s">第一次 503 → 等待 → 第二次成功，解码为 read-1</text><text x="78" y="313" class="s">只有成功后的完整 Action 交回原循环</text><rect x="60" y="390" width="830" height="82" rx="12" class="box"/><text x="78" y="422" class="b">原循环记录 assistant → authorization.ts → 原工具执行器</text><text x="78" y="450" class="s">检查当前策略和路径，取得同一只读 Tool</text><rect x="60" y="530" width="830" height="105" rx="12" class="box"/><text x="78" y="562" class="b">retrying-read-tool.ts → retry → read 依赖</text><text x="78" y="590" class="s">第一次暂时失败 → 等待 → 复核访问 → 第二次读到源码</text><text x="78" y="618" class="s">最终只返回一个带 read-1 的 ToolResult</text><rect x="60" y="695" width="830" height="95" rx="12" class="box"/><text x="78" y="727" class="b">原循环写回一条 tool → 第 2 次 decide → 完成验证</text><text x="78" y="755" class="s">第 3 次模型 HTTP 请求直接成功</text><text x="78" y="783" class="s">结果：决策 2 次 / HTTP 3 次 / 只读依赖尝试 2 次</text><path class="a" d="M450 170V225"/><path class="a" d="M450 330V390"/><path class="a" d="M450 472V530"/><path class="a" d="M450 635V695"/></svg>