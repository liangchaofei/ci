<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title desc"><title id="title">数据流图：Context 从哪里来，结果写到哪里</title><desc id="desc">第 02 篇。State 的消息被复制到本轮 Context，Context 传给 decide。返回动作和工具结果由循环写入 State。Context 本身不写回 State，下一轮从最新状态重新构造。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="840" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="42" font-size="25" fill="#203b35" font-weight="700" text-anchor="start">数据流图：Context 从哪里来，结果写到哪里</text><text x="32" y="75" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">绿色：运行记录与写回　蓝色：本轮输入与返回值</text><rect x="45" y="120" width="290" height="198" rx="12" fill="#edf7f1" stroke="#8fbca7" stroke-width="1.5"/><text x="63" y="152" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">循环持有 State</text><text x="63" y="182" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">goal：本次目标</text><text x="63" y="209" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">messages：消息记录</text><text x="63" y="236" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">decisions：已记录动作数</text><rect x="465" y="120" width="290" height="198" rx="12" fill="#edf3fa" stroke="#adc7e3" stroke-width="1.5"/><text x="483" y="152" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">本轮 Context</text><text x="483" y="182" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">只有 messages 的副本</text><text x="483" y="209" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">不含顶层 goal / decisions</text><text x="483" y="236" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">目标仍在 user 消息中</text><polyline points="335,219 463,219" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="182" font-size="15" fill="#386ca5" font-weight="400" text-anchor="middle">取消息并复制</text><text x="400" y="205" font-size="11" fill="#386ca5" font-weight="400" text-anchor="middle">buildDecisionContext</text><rect x="465" y="406" width="290" height="100" rx="12" fill="#edf3fa" stroke="#adc7e3" stroke-width="1.5"/><text x="483" y="438" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">decide(context)</text><text x="483" y="468" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">根据本轮输入提出 Action</text><polyline points="610,318 610,404" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="625" y="366" font-size="16" fill="#386ca5" font-weight="400" text-anchor="start">传参</text><rect x="45" y="406" width="290" height="100" rx="12" fill="#edf7f1" stroke="#8fbca7" stroke-width="1.5"/><text x="63" y="438" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">循环记录动作</text><text x="63" y="468" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">包装为 assistant 消息</text><polyline points="465,456 337,456" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="440" font-size="15" fill="#386ca5" font-weight="400" text-anchor="middle">返回 Action</text><polyline points="190,406 190,320" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="202" y="366" font-size="16" fill="#267b62" font-weight="400" text-anchor="start">写回</text><rect x="45" y="607" width="290" height="100" rx="12" fill="#fff8e9" stroke="#e3cf9f" stroke-width="1.5"/><text x="63" y="639" font-size="19" fill="#203b35" font-weight="650" text-anchor="start">工具执行入口</text><text x="63" y="669" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">执行 call → 返回 ToolResult</text><polyline points="190,506 190,605" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="202" y="552" font-size="16" fill="#267b62" font-weight="400" text-anchor="start">若动作是 tool</text><polyline points="190,707 190,750 18,750 18,260 43,260" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="45" y="789" font-size="16" fill="#267b62" font-weight="400" text-anchor="start">工具结果先校验身份，再包装为 tool 消息写回</text><rect x="405" y="595" width="350" height="131" rx="12" fill="#f3f5f4" stroke="#ccd9d2" stroke-width="1.5"/><text x="423" y="627" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">Context 本身不写回 State</text><text x="423" y="657" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">下一轮使用更新后的 State</text><text x="423" y="684" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">重新构造一份 Context</text><text x="423" y="711" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">旧副本不会自动增加消息</text></g></svg>