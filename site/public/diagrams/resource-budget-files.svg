<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" role="img" aria-labelledby="title"><title id="title">资源账本与 State 分开持有，具体 HTTP 与流式尝试接入同一门禁</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f5f8f5"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.t{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.a{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style><text x="28" y="42" class="t">这一章接到哪里，哪些机制继续复用</text><rect x="45" y="90" width="950" height="82" rx="12" class="box"/><text x="63" y="122" class="b">budget-scenario.ts：应用只创建一次 budget</text><text x="63" y="150" class="s">同一任务 → 同一适配器 → 同一账本；不是每轮重新创建</text><rect x="45" y="235" width="570" height="100" rx="12" class="box"/><text x="63" y="267" class="b">原 Agent / agent-loop.ts</text><text x="63" y="295" class="s">Context → decide → Action → 工具 → State</text><text x="63" y="323" class="s">总超时继续由 RunControl 管理</text><rect x="45" y="400" width="570" height="110" rx="12" class="box"/><text x="63" y="432" class="b">decider.ts → HTTP / SSE 传输</text><text x="63" y="460" class="s">maxOutputTokens → 单次输出上限</text><text x="63" y="488" class="s">每次传输：begin → usage → report → close</text><rect x="690" y="235" width="320" height="110" rx="12" class="box"/><text x="708" y="267" class="b">model-budget.ts</text><text x="708" y="295" class="s">请求数 / 当前并发 / 未报告数</text><text x="708" y="323" class="s">不足 → ResourceLimitError</text><rect x="690" y="400" width="320" height="110" rx="12" class="box"/><text x="708" y="432" class="b">usage-ledger.ts</text><text x="708" y="460" class="s">累计已报告 token 与估算费用</text><text x="708" y="488" class="s">超额仍保留已经发生的用量</text><rect x="45" y="600" width="570" height="110" rx="12" class="box"/><text x="63" y="632" class="b">原循环只增加一个明确结果</text><text x="63" y="660" class="s">resource-limit 与 cancelled / timed-out 区分</text><text x="63" y="688" class="s">run-ended 报告与返回结果一致</text><rect x="45" y="770" width="950" height="100" rx="12" class="box"/><text x="63" y="802" class="b">没有迁移的职责</text><text x="63" y="830" class="s">工具权限仍在 authorization；工具并发仍在批次执行器</text><text x="63" y="858" class="s">State 写回仍在原循环；资源快照不自动写入 Context 或磁盘日志</text><path class="a" d="M320 172V235"/><path class="a" d="M320 335V400"/><path class="a" d="M615 450H665V290H690"/><path class="a" d="M850 345V400"/><path class="r" d="M690 320H640V650H615"/><text x="655" y="570" class="s">资源不足返回</text></svg>