<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1090" viewBox="0 0 1140 1090" role="img" aria-labelledby="title desc"><title id="title">正常保存与写后退出，差别出现在哪里</title><desc id="desc">左列是首次保存进程：段开始写 open，读取前记录意图，工具返回后循环写回 State，Agent 保存完整日志，核对后标记 sealed。右列是故障子进程：open 和 write-1 意图已经写入，外部文件写一行后立即退出，没有 ToolResult 和段结果保存，下一进程见到 open 后阻止恢复。两列代表两次独立实验，不是同一次运行的连续步骤。</desc><defs><marker id="call" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#316b50"/></marker><marker id="back" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#346b99"/></marker></defs><rect width="1140" height="1090" rx="18" fill="#f5f8f5"/><g font-family="system-ui,sans-serif" fill="#183a2d"><text x="35" y="43" font-size="25" font-weight="700">相同的执行前记录，两种不同的结束位置</text><text x="40" y="87" font-size="22" font-weight="700">正常保存进程：读取后暂停</text><text x="610" y="87" font-size="22" font-weight="700">故障子进程：写一行后退出</text><rect x="40" y="115" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="147" font-size="20" font-weight="700">1  段开始</text><text x="58" y="180" font-size="17">Agent 等 begin 完成，标记 open</text><path d="M285 221V251" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="40" y="257" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="289" font-size="20" font-weight="700">2  每次工具开始前</text><text x="58" y="322" font-size="17">登记 source-1、tests-1，再允许读取</text><path d="M285 363V393" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="40" y="399" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="431" font-size="20" font-weight="700">3  实际工具执行</text><text x="58" y="464" font-size="17">两项读取成功，返回 ToolResult</text><path d="M285 505V535" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="40" y="541" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="573" font-size="20" font-weight="700">4  循环接住结果</text><text x="58" y="606" font-size="17">把两条 tool 消息写入 State</text><path d="M285 647V677" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="40" y="683" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="715" font-size="20" font-weight="700">5  整段结果保存</text><text x="58" y="748" font-size="17">Agent 等 save；日志与检查点写好</text><path d="M285 789V819" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="40" y="825" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="58" y="857" font-size="20" font-weight="700">6  核对后确认</text><text x="58" y="890" font-size="17">标记 sealed，再向入口返回 paused</text><rect x="610" y="115" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="628" y="147" font-size="20" font-weight="700">1  段开始</text><text x="628" y="180" font-size="17">Agent 等 begin 完成，标记 open</text><path d="M855 221V251" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="610" y="257" width="490" height="102" rx="11" fill="#e2f0e7" stroke="#87aa94"/><text x="628" y="289" font-size="20" font-weight="700">2  写入工具开始前</text><text x="628" y="322" font-size="17">登记 write-1，再允许执行</text><path d="M855 363V393" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="610" y="399" width="490" height="102" rx="11" fill="#fff0dc" stroke="#87aa94"/><text x="628" y="431" font-size="20" font-weight="700">3  实际副作用已发生</text><text x="628" y="464" font-size="17">effect.log 已追加一行，次数为 1</text><path d="M855 505V535" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="610" y="541" width="490" height="102" rx="11" fill="#fff0dc" stroke="#87aa94"/><text x="628" y="573" font-size="20" font-weight="700">4  此处突然退出</text><text x="628" y="606" font-size="17">process.exit(23)，没有返回 ToolResult</text><path d="M855 647V677" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="610" y="683" width="490" height="102" rx="11" fill="#fff0dc" stroke="#87aa94"/><text x="628" y="715" font-size="20" font-weight="700">5  没有走到段保存</text><text x="628" y="748" font-size="17">没有完整 RunResult，也没有 sealed</text><path d="M855 789V819" fill="none" stroke="#316b50" stroke-width="2" marker-end="url(#call)"/><rect x="610" y="825" width="490" height="102" rx="11" fill="#fff0dc" stroke="#87aa94"/><text x="628" y="857" font-size="20" font-weight="700">6  新进程只读核查</text><text x="628" y="890" font-size="17">见 open 与 write-1，返回 blocked</text><text x="35" y="1015" font-size="18">左列是首次保存过程，并非恢复后又读取一次；本篇正常续运行的工具次数仍为 0。</text><text x="35" y="1052" font-size="18">两列是独立实验。没有结果 ≠ 没有副作用；本章阻止自动重放，不提供自动补偿。</text></g></svg>