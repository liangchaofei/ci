<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">哪些数据留在内存，哪些能帮助新进程恢复</title><desc id="desc">实线表示保存或读取；报告只是观察，旧许可与旧预算不会自动成为新授权和新总额。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1100" height="100%" fill="#f5f8f4"/><g font-family="system-ui, sans-serif" fill="#173b2d"><text x="40" y="45" font-size="25" font-weight="700">哪些数据留在内存，哪些能帮助新进程恢复</text><text x="40" y="78" font-size="17">实线表示保存或读取；报告只是观察，旧许可与旧预算不会自动成为新授权和新总额。</text><rect x="40" y="130" width="300" height="160" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="162" font-size="20" font-weight="650">原进程内存</text><text x="58" y="194" font-size="17">State：循环当前事实</text><text x="58" y="220" font-size="17">Context：本轮输入副本</text><text x="58" y="246" font-size="17">Trace / requests：观察副本</text><text x="58" y="272" font-size="17">budget：本实例用量账本</text><rect x="400" y="130" width="300" height="160" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="418" y="162" font-size="20" font-weight="650">磁盘会话</text><text x="418" y="194" font-size="17">journal.jsonl：结果记录</text><text x="418" y="220" font-size="17">checkpoint.json：最新快照</text><text x="418" y="246" font-size="17">recovery.json：确认边界</text><text x="418" y="272" font-size="17">报告文件另由 CLI 写入</text><rect x="760" y="130" width="300" height="160" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="162" font-size="20" font-weight="650">新进程恢复检查</text><text x="778" y="194" font-size="17">检查当前工作区与许可</text><text x="778" y="220" font-size="17">检查日志、快照、确认边界</text><text x="778" y="246" font-size="17">只接受有效 paused 结果</text><text x="778" y="272" font-size="17">创建新 Agent 与保存目录</text><rect x="40" y="390" width="300" height="125" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="58" y="422" font-size="20" font-weight="650">未持久化的控制对象</text><text x="58" y="454" font-size="17">活跃 Promise / 输入队列</text><text x="58" y="480" font-size="17">一次批准 / 内存预算对象</text><rect x="760" y="390" width="300" height="125" rx="12" fill="#fff" stroke="#69a087" stroke-width="2"/><text x="778" y="422" font-size="20" font-weight="650">重新组装本段依赖</text><text x="778" y="454" font-size="17">恢复已确认 State</text><text x="778" y="480" font-size="17">新策略、工具与预算</text><text x="778" y="506" font-size="17">同一模型输入与循环机制</text><path d="M340 210 L400 210" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="370.0" y="198.0" text-anchor="middle" font-size="16">保存</text><path d="M700 210 L760 210" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730.0" y="198.0" text-anchor="middle" font-size="16">检查</text><path d="M910 290 L910 390" stroke="#39755c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="920.0" y="340.0" text-anchor="start" font-size="16">获准</text><text x="40" y="570" font-size="17">Agent.run 返回前等待会话保存；run-ended 通知本身不能证明磁盘保存已结束。</text><text x="40" y="597" font-size="17">恢复不会读旧 report 作为授权凭据，也没有实现跨重启的模型费用硬上限。</text></g></svg>