<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">第三阶段：运行、保存与恢复各有边界</title><desc id="desc">第 10 至 15 篇｜追加输入、暂停接续、保存恢复、权限、重试与资源账本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#39755c"/></marker></defs><rect width="1200" height="820" fill="#f5f8f4"/><g font-family="system-ui,sans-serif" fill="#173b2d"><text x="40" y="48" font-size="28" font-weight="700">第三阶段：运行、保存与恢复各有边界</text><text x="40" y="85" font-size="18">第 10 至 15 篇｜追加输入、暂停接续、保存恢复、权限、重试与资源账本。</text><rect x="40" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="184" font-size="23" font-weight="650">接收新的用户要求</text><text x="58" y="222" font-size="18">先进入输入队列</text><text x="58" y="251" font-size="18">到约定边界再写入消息</text><text x="58" y="280" font-size="18">暂停不是任务完成</text><rect x="450" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="184" font-size="23" font-weight="650">驱动原运行循环</text><text x="468" y="222" font-size="18">时间、取消与暂停控制</text><text x="468" y="251" font-size="18">模型请求经过资源门禁</text><text x="468" y="280" font-size="18">安全局部才允许有限重试</text><rect x="860" y="150" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="184" font-size="23" font-weight="650">授权后才执行</text><text x="878" y="222" font-size="18">当前策略与参数检查</text><text x="878" y="251" font-size="18">写入等待一次有效批准</text><text x="878" y="280" font-size="18">执行前再次核对资源</text><rect x="860" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="878" y="464" font-size="23" font-weight="650">留下执行与确认依据</text><text x="878" y="502" font-size="18">先保存执行意图</text><text x="878" y="531" font-size="18">再实际执行并接回结果</text><text x="878" y="560" font-size="18">日志与确认边界落盘</text><rect x="450" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="468" y="464" font-size="23" font-weight="650">新进程先检查恢复</text><text x="468" y="502" font-size="18">核对日志、快照与边界</text><text x="468" y="531" font-size="18">核对当前资源和许可</text><text x="468" y="560" font-size="18">未知执行先阻止并调查</text><rect x="40" y="430" width="300" height="165" rx="14" fill="#fff" stroke="#79a18d" stroke-width="2"/><text x="58" y="464" font-size="23" font-weight="650">获准后明确接续</text><text x="58" y="502" font-size="18">创建新的运行实例</text><text x="58" y="531" font-size="18">安装已确认暂停状态</text><text x="58" y="560" font-size="18">接收新要求，再次决策</text><path d="M340 235 L450 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="223.0" text-anchor="middle" font-size="17">消费输入</text><path d="M750 235 L860 235" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="223.0" text-anchor="middle" font-size="17">工具请求</text><path d="M1010 315 L1010 430" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1022" y="372.5" text-anchor="start" font-size="17">通过门禁</text><path d="M860 510 L750 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="805.0" y="498.0" text-anchor="middle" font-size="17">重启后检查</text><path d="M450 510 L340 510" stroke="#39755c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="395.0" y="498.0" text-anchor="middle" font-size="17">获准</text><rect x="40" y="680" width="1120" height="100" rx="12" fill="#e7f1e9"/><text x="60" y="718" font-size="18">恢复不是自动重跑：旧批准、活动 Promise 和输入队列不会跨进程还原。</text><text x="60" y="749" font-size="18">费用控制目前使用内存账本；新进程重新创建预算，不提供跨重启总额保证。</text></g></svg>