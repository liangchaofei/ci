<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc">
<title id="title">State 保留完整历史，Context 选择本轮输入</title><desc id="desc">六条历史中的原始任务固定保留，较早日志请求和结果作为完整一组省略并提取摘要，最新源码与测试请求及两份结果完整保留。选择器只创建新的 Context，不删除 State。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" stroke="#426458" fill="none" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="630" rx="18" fill="#f6f9f6"/>
<g font-family="system-ui,sans-serif" fill="#173b2c"><text x="32" y="44" font-size="24" font-weight="700">保留运行事实，选择这一轮要发送的材料</text><text x="32" y="78" font-size="17">例：早期日志很长，最新源码与测试必须成组保留</text></g>
<g fill="#fff" stroke="#bdd0c4" stroke-width="2"><rect x="32" y="110" width="390" height="380" rx="12"/><rect x="650" y="110" width="398" height="380" rx="12"/></g>
<g font-family="system-ui,sans-serif" fill="#173b2c" font-size="18"><text x="52" y="143" font-weight="700">完整 State · 6 条消息</text><text x="52" y="189">user：原始任务与限制</text><text x="52" y="237">assistant：读取日志请求</text><text x="52" y="272">tool：很长的日志结果</text><text x="52" y="330">assistant：源码与测试请求</text><text x="52" y="365">tool：源码结果</text><text x="52" y="400">tool：测试结果</text><text x="52" y="462" font-size="16">完整历史不删除，供核对与后续记录</text>
<text x="670" y="143" font-weight="700">本轮 Context · 4 条消息 + 摘要</text><text x="670" y="189">user：原始任务与限制</text><text x="670" y="237">旧日志摘要：退出码 1</text><text x="670" y="272">失败用例 sum([])，不表示已修复</text><text x="670" y="330">assistant：源码与测试请求</text><text x="670" y="365">tool：源码结果</text><text x="670" y="400">tool：测试结果</text><text x="670" y="462" font-size="16">一起计量；转换接口消息后发给模型</text></g>
<g stroke="#426458" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M430 180H642"/><path d="M430 255H642"/><path d="M430 365H642"/></g>
<g font-family="system-ui,sans-serif" fill="#426458" font-size="16" text-anchor="middle"><text x="535" y="165">固定保留</text><text x="535" y="240">提取事实摘要</text><text x="535" y="350">完整组保留</text></g>
<g font-family="system-ui,sans-serif" fill="#173b2c" font-size="18"><text x="32" y="542">消息选择发生在 decide 之前；它不执行工具，也不把摘要写回 State。</text><text x="32" y="583">原始任务、必留近期组与摘要仍装不下 → context-limit → 不启动下一次模型调用。</text></g>
</svg>