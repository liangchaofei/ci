<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1030" viewBox="0 0 800 1030" role="img" aria-labelledby="title desc"><title id="title">真实模型接在哪里，结果怎样进入下一轮</title><desc id="desc">循环从State准备Context，适配器构造DeepSeek消息与工具声明，HTTP请求取得模型响应，解码为Action，原循环记录并执行工具。ToolResult写回State后下一轮重建消息。只有模型是真实请求，读取仍是固定源码模拟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="1030" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="43" font-size="25" fill="#203b35" font-weight="700">真实模型接在哪里，结果怎样进入下一轮</text><text x="30" y="78" font-size="16" fill="#52675f" font-weight="400">第 05 篇 · 蓝色为接口适配，绿色为已有 Runtime</text><rect x="40" y="125" width="290" height="120" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="57" y="155" font-size="19" fill="#203b35" font-weight="650">1  循环准备输入</text><text x="57" y="184" font-size="16" fill="#52675f" font-weight="400">State → Context</text><text x="57" y="210" font-size="16" fill="#52675f" font-weight="400">仍只包含本轮消息</text><rect x="470" y="125" width="290" height="120" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="487" y="155" font-size="19" fill="#203b35" font-weight="650">2  编码接口消息</text><text x="487" y="184" font-size="16" fill="#52675f" font-weight="400">buildDeepSeekMessages</text><text x="487" y="210" font-size="16" fill="#52675f" font-weight="400">加 system 与工具声明</text><polyline points="330,185 468,185" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="350" y="162" font-size="15" fill="#203b35" font-weight="400">传入副本</text><rect x="470" y="340" width="290" height="120" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="487" y="370" font-size="19" fill="#203b35" font-weight="650">3  请求 DeepSeek</text><text x="487" y="399" font-size="16" fill="#52675f" font-weight="400">requestDeepSeek</text><text x="487" y="425" font-size="16" fill="#52675f" font-weight="400">非思考 · 非流式响应</text><polyline points="615,245 615,338" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470" y="545" width="290" height="120" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="487" y="575" font-size="19" fill="#203b35" font-weight="650">4  解码 Action</text><text x="487" y="604" font-size="16" fill="#52675f" font-weight="400">decodeDeepSeekAction</text><text x="487" y="630" font-size="16" fill="#52675f" font-weight="400">未知 JSON → 检查 → 动作</text><polyline points="615,460 615,543" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="545" width="290" height="120" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="57" y="575" font-size="19" fill="#203b35" font-weight="650">5  原循环处理动作</text><text x="57" y="604" font-size="16" fill="#52675f" font-weight="400">记录 assistant 请求</text><text x="57" y="630" font-size="16" fill="#52675f" font-weight="400">调用已有工具执行入口</text><polyline points="470,605 332,605" fill="none" stroke="#386ca5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="369" y="585" font-size="15" fill="#203b35" font-weight="400">返回动作</text><rect x="40" y="735" width="290" height="120" rx="12" fill="#fff8e9" stroke="#c4d5cd"/><text x="57" y="765" font-size="19" fill="#203b35" font-weight="650">6  工具结果写回</text><text x="57" y="794" font-size="16" fill="#52675f" font-weight="400">检查 callId 并追加 tool</text><text x="57" y="820" font-size="16" fill="#52675f" font-weight="400">读取仍返回固定源码</text><polyline points="185,665 185,733" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="40,795 17,795 17,185 38,185" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="390" y="735" width="370" height="120" rx="12" fill="#f0f2f1" stroke="#c4d5cd"/><text x="407" y="765" font-size="19" fill="#203b35" font-weight="650">同一调用身份贯穿</text><text x="407" y="794" font-size="16" fill="#52675f" font-weight="400">模型 tool_calls[].id</text><text x="407" y="820" font-size="16" fill="#52675f" font-weight="400">→ 本地 callId</text><text x="407" y="846" font-size="16" fill="#52675f" font-weight="400">→ 下一请求 tool_call_id</text><text x="40" y="913" font-size="18" fill="#203b35" font-weight="400">典型第二次请求：system → user → assistant → tool</text><text x="40" y="951" font-size="16" fill="#203b35" font-weight="400">模型没有取得本地函数；Runtime 不在适配器内重写循环。</text><text x="40" y="989" font-size="15" fill="#52675f" font-weight="400">本章仅接入真实决策，未实现实际修改、流式处理或完整质量评估。</text></g></svg>