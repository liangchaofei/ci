<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1070" viewBox="0 0 800 1070" role="img" aria-labelledby="title desc"><title id="title">工具执行：先查找、再检查、最后操作</title><desc id="desc">第04篇当前实现。循环传入ToolCall；注册表查找工具，未知名称直接失败；invoke解析参数，非法参数直接失败；通过后执行模拟读取。执行入口为成功或失败结果加调用ID，循环核对并写回State，下一轮构造Context。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="1070" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="25" fill="#203b35" font-weight="700">工具执行：先查找、再检查、最后操作</text><text x="30" y="76" font-size="16" fill="#52675f" font-weight="400">第 04 篇当前实现 · 读取体仍返回固定源码</text><rect x="35" y="110" width="480" height="90" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="53" y="139" font-size="19" fill="#203b35" font-weight="600">循环交出 ToolCall</text><text x="53" y="167" font-size="16" fill="#52675f" font-weight="400">name: read_source · id: read-1</text><rect x="35" y="240" width="480" height="100" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="53" y="269" font-size="19" fill="#203b35" font-weight="600">1  注册表查名称</text><text x="53" y="297" font-size="16" fill="#52675f" font-weight="400">registry.get(call.name)</text><text x="53" y="322" font-size="16" fill="#52675f" font-weight="400">取得工具入口 Tool</text><rect x="555" y="240" width="210" height="100" rx="12" fill="#fff5e5" stroke="#c4d5cd"/><text x="573" y="269" font-size="19" fill="#203b35" font-weight="600">找不到工具</text><text x="573" y="297" font-size="16" fill="#52675f" font-weight="400">unknown-tool</text><rect x="35" y="385" width="480" height="100" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="53" y="414" font-size="19" fill="#203b35" font-weight="600">2  invoke 检查参数</text><text x="53" y="442" font-size="16" fill="#52675f" font-weight="400">parse({ path: &quot;src/sum.ts&quot; })</text><text x="53" y="467" font-size="16" fill="#52675f" font-weight="400">成功才取得已确认的 args</text><rect x="555" y="385" width="210" height="100" rx="12" fill="#fff5e5" stroke="#c4d5cd"/><text x="573" y="414" font-size="19" fill="#203b35" font-weight="600">参数被拒绝</text><text x="573" y="442" font-size="16" fill="#52675f" font-weight="400">invalid-arguments</text><rect x="35" y="530" width="480" height="100" rx="12" fill="#fff8e9" stroke="#c4d5cd"/><text x="53" y="559" font-size="19" fill="#203b35" font-weight="600">3  execute(args) 模拟读取</text><text x="53" y="587" font-size="16" fill="#52675f" font-weight="400">执行日志出现在这里</text><text x="53" y="612" font-size="16" fill="#52675f" font-weight="400">返回固定 sourceCode</text><rect x="555" y="530" width="210" height="100" rx="12" fill="#fff5e5" stroke="#c4d5cd"/><text x="573" y="559" font-size="19" fill="#203b35" font-weight="600">检查或执行抛错</text><text x="573" y="587" font-size="16" fill="#52675f" font-weight="400">tool-error</text><rect x="35" y="685" width="730" height="100" rx="12" fill="#edf3fa" stroke="#c4d5cd"/><text x="53" y="714" font-size="19" fill="#203b35" font-weight="600">4  执行入口返回 ToolResult</text><text x="53" y="742" font-size="16" fill="#52675f" font-weight="400">将成功值或错误包装，并添加 callId: call.id</text><text x="53" y="767" font-size="16" fill="#52675f" font-weight="400">createToolExecutor 不持有或更新 State</text><rect x="35" y="840" width="730" height="100" rx="12" fill="#edf7f1" stroke="#c4d5cd"/><text x="53" y="869" font-size="19" fill="#203b35" font-weight="600">5  循环核对身份，再写回 State</text><text x="53" y="897" font-size="16" fill="#52675f" font-weight="400">追加 tool 消息 → 从最新 State 构造 Context → 再次 decide</text><polyline points="275,200 275,238" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="275,340 275,383" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="275,485 275,528" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="275,630 275,683" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="400,785 400,838" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="515,290 553,290" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="515,435 553,435" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="515,580 553,580" stroke="#386ca5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="660,340 783,340 783,663 680,663 680,683" stroke="#a06c20" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="660,485 783,485" stroke="#a06c20" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><polyline points="660,630 783,630" stroke="#a06c20" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="35" y="987" font-size="17" fill="#203b35" font-weight="400">右侧错误也会返回，循环记录后由下一轮决定怎么办。</text><text x="35" y="1024" font-size="15" fill="#52675f" font-weight="400">图中省略完成验证与次数预算；真实模型、权限审批和超时后续接入。</text></g></svg>