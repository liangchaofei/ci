<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">工具批次：请求、完成和记录三个顺序</title>
<desc id="desc">一次决策提出源码和测试两个读取请求。最多两个执行者同时等待，测试先完成；结果按原请求下标归位。循环确认整批后，按源码、测试顺序写入 State，下一轮 Context 才包含两份结果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#426458" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="640" rx="18" fill="#f6f9f6"/>
<g font-family="system-ui, sans-serif" fill="#173b2c"><text x="36" y="46" font-size="25" font-weight="700">一份动作，两次读取，三种顺序</text><text x="36" y="78" font-size="16">例：并发上限 2；仅当两种工具都由应用声明可并行时启用</text></g>
<g stroke="#bdd0c4" fill="#fff" stroke-width="2"><rect x="36" y="110" width="292" height="110" rx="12"/><rect x="36" y="250" width="292" height="110" rx="12"/><rect x="390" y="110" width="292" height="110" rx="12"/><rect x="390" y="250" width="292" height="110" rx="12"/><rect x="744" y="110" width="300" height="250" rx="12"/><rect x="36" y="422" width="1008" height="166" rx="12"/></g>
<g font-family="system-ui, sans-serif" fill="#173b2c" font-size="18"><text x="56" y="142" font-weight="700">请求 0 · source-1</text><text x="56" y="175">read_source</text><text x="56" y="201" font-size="16">读取源码，较慢返回</text><text x="56" y="282" font-weight="700">请求 1 · tests-1</text><text x="56" y="315">read_tests</text><text x="56" y="341" font-size="16">读取测试片段，较快返回</text><text x="410" y="143" font-weight="700">执行者领取 0</text><text x="410" y="178">等待源码 → 后完成</text><text x="410" y="283" font-weight="700">执行者领取 1</text><text x="410" y="318">等待测试 → 先完成</text><text x="764" y="143" font-weight="700">按领取的位置保存</text><text x="764" y="188">results[0] = 源码结果</text><text x="764" y="233">results[1] = 测试结果</text><text x="764" y="283" font-size="16">callId 仍需与原请求一致</text><text x="764" y="317" font-size="16">这里是局部数组，还不是 State</text><text x="56" y="458" font-weight="700">唯一写回位置：agent-loop.ts</text><text x="56" y="495">整批返回 + 停止检查通过 → State 追加 source-1、tests-1 两条 tool 消息</text><text x="56" y="531">下一次构造 Context → decide 同时收到两份观察</text><text x="56" y="566" font-size="16">若取消或身份错配：不写入本批结果；已发生的外部操作不会因此撤销</text></g>
<g stroke="#426458" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M328 165H383"/><path d="M328 305H383"/><path d="M682 165H737"/><path d="M682 305H714V225H737"/><path d="M895 360V412"/></g>
</svg>