<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" role="img" aria-labelledby="title"><title id="title">写入请求先通过许可检查，结果返回原循环</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#41665a"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f7faf8"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#203d33}.title{font-size:26px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#7ca18e;stroke-width:2}.arrow{stroke:#41665a;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#658595;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style><text x="32" y="44" class="title">第 14 篇：先授予这一次执行权</text><rect x="70" y="78" width="600" height="82" rx="12" class="box"/><text x="90" y="112" class="body">原循环：取得模型动作，记录 assistant 请求</text><text x="90" y="141" class="small">此时只有请求，还没有发生文件写入</text><rect x="70" y="210" width="600" height="110" rx="12" class="box"/><text x="90" y="244" class="body">许可入口：检查规则、参数与当前文件</text><text x="90" y="273" class="small">写请求 → 等待人工批准</text><text x="90" y="302" class="small">批准后 → 再查规则、文件、期限和取消</text><rect x="70" y="385" width="600" height="82" rx="12" class="box"/><text x="90" y="419" class="body">原工具执行器：真正调用获准操作</text><text x="90" y="448" class="small">固定脚本 + 固定目标权限 → 子进程</text><rect x="70" y="530" width="600" height="82" rx="12" class="box"/><text x="90" y="564" class="body">可信子进程：读 / 写演示副本 sum.ts</text><text x="90" y="593" class="small">写入后读回核对，返回版本</text><rect x="70" y="670" width="600" height="76" rx="12" class="box"/><text x="90" y="704" class="body">原循环：保存 tool 观察，构造下一轮 Context</text><text x="90" y="733" class="small">有证据时才完成；拒绝观察也能进入下一轮</text><path class="arrow" d="M340 160V210"/><path class="arrow" d="M340 320V385"/><path class="arrow" d="M340 467V530"/><path class="back" d="M340 612V670"/><text x="90" y="355" class="small">任一许可检查失败 → 不调用工具，直接返回错误观察</text></svg>