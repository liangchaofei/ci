<svg xmlns="http://www.w3.org/2000/svg" width="800" height="870" viewBox="0 0 800 870" role="img" aria-labelledby="title desc"><title id="title">流程图：一次读取怎样影响下一次决策</title><desc id="desc">第 01 篇正常路径。初始状态只有 user；决策产生 tool 动作并记录 assistant；工具返回结果后再写回 tool；第二次决策提出 finish，核对完成规则后返回 completed。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="800" height="870" rx="20" fill="#fafcfb"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="42" font-size="25" fill="#203b35" font-weight="700" text-anchor="start">流程图：一次读取怎样影响下一次决策</text><text x="32" y="75" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">按 1 → 6 阅读；工具返回与状态写回是两个不同步骤</text><rect x="82" y="105" width="636" height="94" rx="12" fill="#ffffff" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="137" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">1  初始化 State</text><text x="100" y="167" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">messages：user</text><text x="100" y="194" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">decisions：0</text><polyline points="400,199 400,222" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="224" width="636" height="94" rx="12" fill="#edf3fa" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="256" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">2  第一次 decide → tool</text><text x="100" y="286" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">记录读取请求：user → assistant</text><text x="100" y="313" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">decisions：1</text><polyline points="400,318 400,341" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="343" width="636" height="94" rx="12" fill="#fff8e9" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="375" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">3  executeTool 返回 ToolResult</text><text x="100" y="405" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">局部变量 result 已有源码</text><text x="100" y="432" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">此时还没有追加 tool 消息</text><polyline points="400,437 400,460" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="462" width="636" height="94" rx="12" fill="#edf7f1" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="494" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">4  将 result 包装成 tool 消息</text><text x="100" y="524" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">写回：user → assistant → tool</text><text x="100" y="551" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">decisions 仍为 1</text><polyline points="400,556 400,579" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="581" width="636" height="94" rx="12" fill="#edf3fa" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="613" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">5  第二次 decide → finish</text><text x="100" y="643" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">收到含源码的状态，再记录完成请求</text><text x="100" y="670" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">消息 4 条；decisions：2</text><polyline points="400,675 400,698" fill="none" stroke="#267b62" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="700" width="636" height="94" rx="12" fill="#edf7f1" stroke="#ccd9d2" stroke-width="1.5"/><text x="100" y="732" font-size="18" fill="#203b35" font-weight="650" text-anchor="start">6  validateFinish → completed</text><text x="100" y="762" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">应用完成规则核对通过，循环返回</text><text x="100" y="789" font-size="16" fill="#52675f" font-weight="400" text-anchor="start">入口拿到最终 state 与 outcome</text><text x="400" y="854" font-size="16" fill="#52675f" font-weight="400" text-anchor="middle">完成本例诊断；没有修改文件，也没有接入真实模型</text></g></svg>